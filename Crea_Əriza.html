<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CREA — Ərizə generatoru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F5F0;
    --paper-edge:#EAE6DC;
    --ink:#1E2A32;
    --ink-soft:#5B6B73;
    --accent:#0F5C56;
    --accent-soft:#DCEBE9;
    --line:#D8D3C7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; width:100%; overflow-x:hidden;}
  body{
    font-family:'IBM Plex Sans', sans-serif;
    background:#EDEAE2;
    color:var(--ink);
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
  }
  .topbar .mark{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    font-size:15px;
    letter-spacing:.2px;
  }
  .topbar .mark .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .topbar .sub{
    color:var(--ink-soft);
    font-size:12px;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  /* ---------- Landing ---------- */
  .landing{
    max-width:720px;
    margin:20px auto;
    text-align:center;
    padding:0 10px;
  }
  .landing h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:26px;
    line-height:1.25;
    margin:0 0 8px;
  }
  .landing p.lead{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 24px;
  }
  .choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .choice{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:20px 16px;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
    font-family:inherit;
    color:var(--ink);
  }
  .choice:hover{ border-color:var(--accent); }
  .choice:active{ transform:scale(.99); }
  .choice svg{ width:24px; height:24px; stroke:var(--accent); margin-bottom:12px; }
  .choice h3{
    font-size:15px;
    margin:0 0 4px;
    font-weight:600;
  }
  .choice p{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.4;
  }
  @media (max-width:640px){
    .choice-grid{ grid-template-columns:1fr; }
    .landing h1{ font-size:22px; }
    .wrap{ padding:16px 10px 40px; }
  }

  /* ---------- Builder layout ---------- */
  .builder{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:960px){
    .builder{ grid-template-columns:1fr; }
  }
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px 16px;
  }
  .step-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 12px;
    font-weight:500;
  }
  .step-label .num{
    width:18px;height:18px;
    border-radius:50%;
    border:1px solid var(--accent);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;
    flex-shrink:0;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:inherit;
    font-size:16px;
    color:var(--ink);
    background:#fff;
    -webkit-appearance:none;
  }
  .field select{
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6B73' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 14px;
    padding-right: 32px;
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .field .hint{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .divider{
    border:none;
    border-top:1px solid var(--line);
    margin:18px 0;
  }
  .computed{
    background:var(--accent-soft);
    border:1px solid var(--accent);
    border-radius:4px;
    padding:9px 10px;
    font-size:13px;
    color:var(--ink);
    margin-bottom:14px;
  }
  .computed strong{ color:var(--accent); }
  .actions{
    display:flex;
    gap:8px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .btn{
    border:none;
    border-radius:4px;
    padding:12px 16px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    flex:1;
    text-align:center;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:#0d4d48; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--ink-soft); }
  .btn-small{
    border:none;
    border-radius:4px;
    padding:5px 9px;
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    background:var(--accent-soft);
    color:var(--accent);
  }
  .btn-small.danger{ background:#F4DEDB; color:#9B3B30; }

  .sig-pad-panel{
    margin-top:8px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px;
    background:#fff;
  }
  .sig-pad-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .sig-canvas-wrap{
    background:#F9F8F6;
    border:1px solid var(--line);
    border-radius:4px;
    cursor:crosshair;
    overflow:hidden;
    touch-action:none;
    width: 100%;
    height: 110px;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  /* ---------- Paper preview ---------- */
  .paper-shell{
    background:#DDD9CD;
    border-radius:6px;
    padding:16px 10px;
    display:flex;
    justify-content:center;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .paper{
    background:#fff;
    width:210mm;
    min-height:297mm;
    padding:18mm 15mm;
    box-shadow:0 4px 16px rgba(30,42,50,.12);
    font-family:'Times New Roman', Times, serif;
    font-size:12pt;
    line-height:1.5;
    color:#111;
    flex-shrink:0;
  }
  .paper .to-line{ margin-bottom:2px; text-align:right; }
  .paper .director{ font-weight:600; text-decoration:underline; margin-bottom:16px; text-align:right; }
  .paper .position-line{ margin-bottom:2px; text-align:right; }
  .paper .applicant{ font-weight:600; margin-bottom:24px; text-align:right; }
  .paper .title{
    text-align:center;
    font-weight:600;
    font-size:14pt;
    letter-spacing:2px;
    margin:0 0 24px;
  }
  .paper .body-text{ margin-bottom:40px; text-align:justify; }
  .paper .sign-row{ font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
  .paper .placeholder{ color:#999; font-style:italic; }
  .paper .sig-img{
    height:70px; max-width:280px; object-fit:contain; margin-left:-4px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  @media print{
    @page{ size:A4; margin:0; }
    body *{ visibility:hidden; }
    .paper, .paper *{ visibility:visible; }
    .paper{
      position:absolute; top:0; left:0;
      box-shadow:none; width:210mm; min-height:297mm;
      padding:18mm 15mm;
      margin:0;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="mark"><span class="dot"></span> CREA</div>
  <div class="sub">Ərizə generatoru</div>
</div>

<div class="wrap">

  <!-- LANDING -->
  <div class="landing" id="landing">
    <h1>Hansı ərizəni hazırlayırsınız?</h1>
    <p class="lead">Növü seçin, məlumatları doldurun — ərizə avtomatik formalaşsın.</p>
    <div class="choice-grid">
      <button class="choice" onclick="startFlow('icaze')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
        <h3>Saatlıq icazə</h3>
        <p>Bir günün içində müəyyən saatlar üçün icazə ərizəsi.</p>
      </button>
      <button class="choice" onclick="startFlow('mezuniyyet')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
        <h3>Günlük məzuniyyət</h3>
        <p>Başlanğıc tarixi və gün sayına görə növbəti əmək məzuniyyəti ərizəsi.</p>
      </button>
    </div>
  </div>

  <!-- BUILDER -->
  <div class="builder" id="builder" style="display:none;">
    <div class="panel">
      <div class="step-label"><span class="num">1</span> Şirkət və ərizəçi məlumatları</div>

      <div class="field">
        <label for="companySelect">Şirkət</label>
        <select id="companySelect">
          <option value="crea_retail">"CREA RETAIL SOLUTIONS" MMC</option>
          <option value="crea_inc">"CREA INC" MMC</option>
        </select>
        <div class="hint" id="directorPreview"></div>
      </div>

      <hr class="divider">

      <div class="field">
        <label for="employeeSelect">Ərizəçi</label>
        <select id="employeeSelect">
          <option value="Elnur Abbasov">Elnur Abbasov</option>
          <option value="Fuad Müzəffərzədə">Fuad Müzəffərzədə</option>
          <option value="Kənan İbrahimov" selected>Kənan İbrahimov</option>
          <option value="Sadiq Hüseynov">Sadiq Hüseynov</option>
          <option value="Kənan Camalzadə">Kənan Camalzadə</option>
        </select>
        
        <div class="sig-pad-panel">
          <div class="sig-pad-header">
            <span id="sigPadTitle">İmzanızı çəkin</span>
            <button type="button" class="btn-small danger" onclick="clearSignature()">Təmizlə</button>
          </div>
          <div class="sig-canvas-wrap">
            <canvas id="sigCanvas"></canvas>
          </div>
        </div>
      </div>

      <hr class="divider">

      <div class="step-label"><span class="num">2</span> <span id="stepTwoLabel">Tarix və saat</span></div>

      <div id="icazeFields">
        <div class="field">
          <label for="icDate">İcazə tarixi</label>
          <input type="date" id="icDate">
        </div>
        <div class="row2">
          <div class="field">
            <label for="icFrom">Saatdan</label>
            <input type="time" id="icFrom" value="17:00">
          </div>
          <div class="field">
            <label for="icTo">Saata</label>
            <input type="time" id="icTo" value="19:00">
          </div>
        </div>
      </div>

      <div id="mezFields" style="display:none;">
        <div class="field">
          <label for="mzWorkYear">İş ili (məs: 2025-2026)</label>
          <input id="mzWorkYear" placeholder="2025-2026">
        </div>
        <div class="row2">
          <div class="field">
            <label for="mzStart">Başlanğıc tarixi</label>
            <input type="date" id="mzStart">
          </div>
          <div class="field">
            <label for="mzDays">Gün sayı</label>
            <input type="number" id="mzDays" min="1" value="2">
          </div>
        </div>
        <div class="computed" id="mzComputed"></div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" onclick="window.print()">Çap et / PDF</button>
        <button class="btn btn-ghost" onclick="goToLanding()">Geri</button>
      </div>
    </div>

    <div class="paper-shell">
      <div class="paper" id="paperContent"></div>
    </div>
  </div>

</div>

<script>
const COMPANIES = {
  crea_retail: { company: '"CREA RETAIL SOLUTIONS" MMC', director: 'Mətanət Keser' },
  crea_inc:    { company: '"CREA INC" MMC',              director: 'Ahmet Keser' }
};
const POSITION_TEXT = 'İnformasiya Texnologiyaları üzrə mütəxəssis';
const EMPLOYEES = ['Elnur Abbasov','Fuad Müzəffərzədə','Kənan İbrahimov','Sadiq Hüseynov','Kənan Camalzadə'];

let currentType = null;
let currentCompanyKey = 'crea_retail';
let signaturesCache = {};

const canvas = document.getElementById('sigCanvas');
const ctx = canvas.getContext('2d');
let isDrawing = false;

function initCanvasSize(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  ctx.strokeStyle = '#333058';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  redrawCanvas();
}

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function startDraw(e){
  isDrawing = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
  e.preventDefault();
}

function draw(e){
  if(!isDrawing) return;
  const pos = getPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
  e.preventDefault();
}

function stopDraw(){
  if(!isDrawing) return;
  isDrawing = false;
  saveCurrentSignature();
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
window.addEventListener('mouseup', stopDraw);

canvas.addEventListener('touchstart', startDraw, {passive: false});
canvas.addEventListener('touchmove', draw, {passive: false});
canvas.addEventListener('touchend', stopDraw);

function clearSignature(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const name = currentEmployeeName();
  delete signaturesCache[name];
  if(window.storage && window.storage.delete){
    window.storage.delete(sigKey(name), true).catch(()=>{});
  }
  renderPaper();
}

function redrawCanvas(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const name = currentEmployeeName();
  if(signaturesCache[name]){
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
    };
    img.src = signaturesCache[name];
  }
}

function saveCurrentSignature(){
  const name = currentEmployeeName();
  const dataUrl = canvas.toDataURL('image/png');
  signaturesCache[name] = dataUrl;
  
  if(window.storage && window.storage.set){
    window.storage.set(sigKey(name), dataUrl, true).catch(()=>{});
  }
  renderPaper();
}

function pad(n){ return String(n).padStart(2,'0'); }

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function fmt(dateStr){
  if(!dateStr) return '<span class="placeholder">__.__.____</span>';
  const [y,m,d] = dateStr.split('-');
  return `${d}.${m}.${y}`;
}

function fmtTime(t){
  if(!t) return '<span class="placeholder">__:__</span>';
  return t;
}

function addDays(dateStr, days){
  if(!dateStr || !days) return null;
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d, 12, 0, 0);
  dt.setDate(dt.getDate() + Number(days));
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}

function defaultWorkYear(dateStr){
  return '2025-2026';
}

function numToWordsAz(n){
  n = Number(n);
  if(!Number.isFinite(n) || n < 0) return '';
  if(n === 0) return 'sıfır';
  const ones = ['','bir','iki','üç','dörd','beş','altı','yeddi','səkkiz','doqquz'];
  const tens = ['','on','iyirmi','otuz','qırx','əlli','altmış','yetmiş','səksən','doxsan'];

  function under100(num){
    const t = Math.floor(num/10), o = num%10;
    return [tens[t], ones[o]].filter(Boolean).join(' ');
  }
  function under1000(num){
    const h = Math.floor(num/100), rest = num%100;
    const parts = [];
    if(h) parts.push(h === 1 ? 'yüz' : `${ones[h]} yüz`);
    if(rest) parts.push(under100(rest));
    return parts.join(' ');
  }
  if(n < 1000) return under1000(n);
  return String(n);
}

function onCompanyChange(){
  currentCompanyKey = document.getElementById('companySelect').value;
  const preview = document.getElementById('directorPreview');
  if(preview) preview.textContent = 'Direktor: ' + COMPANIES[currentCompanyKey].director;
  renderPaper();
}

function currentEmployeeName(){
  return document.getElementById('employeeSelect').value;
}

function onEmployeeChange(){
  redrawCanvas();
  renderPaper();
}

function sigKey(name){
  return 'manual_sig:' + name.trim().replace(/\s+/g, '_');
}

async function loadAllSignatures(){
  for(const name of EMPLOYEES){
    try{
      if(window.storage && window.storage.get){
        const res = await window.storage.get(sigKey(name), true);
        if(res && res.value) signaturesCache[name] = res.value;
      }
    }catch(e){}
  }
  redrawCanvas();
  renderPaper();
}

function startFlow(type){
  currentType = type;
  document.getElementById('landing').style.display = 'none';
  document.getElementById('builder').style.display = 'grid';

  setTimeout(initCanvasSize, 50);

  const today = new Date();
  const todayStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

  if(type === 'icaze'){
    document.getElementById('stepTwoLabel').textContent = 'Tarix və saat';
    document.getElementById('icazeFields').style.display = 'block';
    document.getElementById('mezFields').style.display = 'none';
    if(!document.getElementById('icDate').value) document.getElementById('icDate').value = todayStr;
  } else {
    document.getElementById('stepTwoLabel').textContent = 'Tarix və gün sayı';
    document.getElementById('icazeFields').style.display = 'none';
    document.getElementById('mezFields').style.display = 'block';
    if(!document.getElementById('mzStart').value) document.getElementById('mzStart').value = todayStr;
    if(!document.getElementById('mzWorkYear').value) document.getElementById('mzWorkYear').value = defaultWorkYear(todayStr);
  }
  renderPaper();
}

function goToLanding(){
  document.getElementById('builder').style.display = 'none';
  document.getElementById('landing').style.display = 'block';
}

function renderPaper(){
  const c = COMPANIES[currentCompanyKey] || COMPANIES.crea_retail;
  const company = c.company;
  const director = c.director;
  const position = POSITION_TEXT;
  const employee = currentEmployeeName() || '____________';

  let bodyHtml = '';
  let signDateHtml = '';

  if(currentType === 'icaze'){
    const date = document.getElementById('icDate').value;
    const from = document.getElementById('icFrom').value;
    const to = document.getElementById('icTo').value;
    bodyHtml = `Yazıb xahiş edirəm ki, ${fmt(date)} tarixində şəxsi işimlə əlaqədar olaraq saat ${fmtTime(from)}-dan saat ${fmtTime(to)}-a dək mənə icazə verəsiniz.`;
    signDateHtml = fmt(todayStr());
  } else if(currentType === 'mezuniyyet'){
    const workYear = document.getElementById('mzWorkYear').value || '____-____';
    const start = document.getElementById('mzStart').value;
    const days = document.getElementById('mzDays').value;
    const end = addDays(start, days);

    const computedBox = document.getElementById('mzComputed');
    if(start && days){
      computedBox.innerHTML = `Bitmə tarixi avtomatik: <strong>${fmt(end)}-ci il</strong>`;
    } else {
      computedBox.innerHTML = `Başlanğıc tarixi və gün sayını daxil edin.`;
    }

    const daysWords = days ? numToWordsAz(days) : '__';
    bodyHtml = `Yazıb xahiş edirəm ki, məni ${workYear}-ci il tarixinə olan iş ili üçün ${days || '__'} (${daysWords}) gün müddətində, ${fmt(start)}-ci il tarixindən ${end ? fmt(end) : '<span class="placeholder">__.__.____</span>'}-ci ilədək növbəti əmək məzuniyyətinə buraxasınız.`;
    signDateHtml = fmt(todayStr());
  } else {
    return;
  }

  const sig = signaturesCache[employee];
  const sigHtml = sig
    ? `<img class="sig-img" src="${sig}" alt="imza">`
    : `<span class="placeholder">_______________</span>`;

  document.getElementById('paperContent').innerHTML = `
    <div class="to-line">${company} Məhdud Məsuliyyətli Cəmiyyətinin direktoru</div>
    <div class="director">${director}-ə</div>
    <div class="position-line">${position} vəzifəsində çalışan</div>
    <div class="applicant">${employee} tərəfindən</div>
    <div class="title">Ə R İ Z Ə</div>
    <div class="body-text">${bodyHtml}</div>
    <div class="sign-row">İmza: ${sigHtml}</div>
    <div class="sign-row">Tarix: ${signDateHtml}</div>
  `;
}

document.querySelectorAll('input, select').forEach(el => {
  if(el.id === 'companySelect' || el.id === 'employeeSelect') return;
  el.addEventListener('input', renderPaper);
});
document.getElementById('companySelect').addEventListener('change', onCompanyChange);
document.getElementById('employeeSelect').addEventListener('change', onEmployeeChange);

document.getElementById('directorPreview').textContent = 'Direktor: ' + COMPANIES[currentCompanyKey].director;
loadAllSignatures();
</script>
